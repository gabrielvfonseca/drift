name: Bug report
description: Something behaves differently from what the docs describe
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A code snippet or a link to a repo that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@drift/after version"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and environment
      placeholder: "Node 22.x / Chrome 130 / React 19.1"
